<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img"
     aria-label="Mail is read on the phone and offered for your day, and you approve it">
  <title>Mail becomes your day</title>
  <rect width="1200" height="250" rx="24" fill="#0C1114"/>
  <text x="600" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="17" fill="#8E9B98">
    Your mail becomes your day without leaving the phone
  </text>
  
  <g>
    <line x1="370" y1="132" x2="420" y2="132" stroke="#8E9B98" stroke-width="2" stroke-opacity="0.5"/>
    <circle cx="370" cy="132" r="4" fill="#65E6D0">
      <animate attributeName="cx" values="370;420" dur="1.1s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <line x1="760" y1="132" x2="810" y2="132" stroke="#8E9B98" stroke-width="2" stroke-opacity="0.5"/>
    <circle cx="760" cy="132" r="4" fill="#65E6D0">
      <animate attributeName="cx" values="760;810" dur="1.1s" begin="2.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="2.0s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.3s" fill="freeze"/>
    <rect x="60" y="78" width="300" height="108" rx="20" fill="#141A1F" stroke="#8E9B98" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="94" cy="112" r="11" fill="#8E9B98" opacity="0.9"/>
    <text x="118" y="118" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="18" font-weight="600" fill="#E8F0ED">New mail</text>
    <text x="84" y="156" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="14" fill="#8E9B98">“Guest lecture: compilers,” CSE Department</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.8999999999999999s" fill="freeze"/>
    <rect x="450" y="78" width="300" height="108" rx="20" fill="#141A1F" stroke="#65E6D0" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="484" cy="112" r="11" fill="#65E6D0" opacity="0.9"/>
    <text x="508" y="118" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="18" font-weight="600" fill="#E8F0ED">Read on the phone</text>
    <text x="474" y="156" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="14" fill="#8E9B98">Apple Intelligence, on device · nothing sent</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
    <rect x="840" y="78" width="300" height="108" rx="20" fill="#141A1F" stroke="#B8F36B" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="874" cy="112" r="11" fill="#B8F36B" opacity="0.9"/>
    <text x="898" y="118" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="18" font-weight="600" fill="#E8F0ED">Offered for your day</text>
    <text x="864" y="156" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="14" fill="#8E9B98">Wed 11:00 · Seminar hall 2 · you approve it</text>
  </g>
  <text x="600" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="14" fill="#8E9B98">
    Priority senders first, muted ones counted and hidden, every item saying which address it came to
  </text>
</svg>
