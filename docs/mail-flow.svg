<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img"
     aria-label="Mail is read on the phone and offered for your day, and you approve it">
  <title>Mail becomes your day</title>
  <rect width="1280" height="250" rx="24" fill="#0C1114"/>
  <text x="640" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="17" fill="#8E9B98">
    Your mail becomes your day without leaving the phone
  </text>
  
  <g>
    <line x1="400" y1="132" x2="450" y2="132" stroke="#8E9B98" stroke-width="2" stroke-opacity="0.5"/>
    <circle cx="400" cy="132" r="4" fill="#65E6D0">
      <animate attributeName="cx" values="400;450" dur="1.1s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <line x1="830" y1="132" x2="880" y2="132" stroke="#8E9B98" stroke-width="2" stroke-opacity="0.5"/>
    <circle cx="830" cy="132" r="4" fill="#65E6D0">
      <animate attributeName="cx" values="830;880" dur="1.1s" begin="2.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="2.0s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.3s" fill="freeze"/>
    <rect x="30" y="78" width="360" height="112" rx="20" fill="#141A1F" stroke="#8E9B98" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="64" cy="112" r="11" fill="#8E9B98" opacity="0.9"/>
    <text x="88" y="118" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="18" font-weight="600" fill="#E8F0ED">New mail</text>
    <text x="54" y="156" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="14" fill="#8E9B98">“Guest lecture: compilers” · CSE Dept.</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.8999999999999999s" fill="freeze"/>
    <rect x="460" y="78" width="360" height="112" rx="20" fill="#141A1F" stroke="#65E6D0" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="494" cy="112" r="11" fill="#65E6D0" opacity="0.9"/>
    <text x="518" y="118" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="18" font-weight="600" fill="#E8F0ED">Read on the phone</text>
    <text x="484" y="156" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="14" fill="#8E9B98">Apple Intelligence, on the phone</text>
  </g>
  <g>
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
    <rect x="890" y="78" width="360" height="112" rx="20" fill="#141A1F" stroke="#B8F36B" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="924" cy="112" r="11" fill="#B8F36B" opacity="0.9"/>
    <text x="948" y="118" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="18" font-weight="600" fill="#E8F0ED">Offered for your day</text>
    <text x="914" y="156" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="14" fill="#8E9B98">Wed 11:00 · Seminar hall 2 · you approve</text>
  </g>
  <text x="640" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif" font-size="14" fill="#8E9B98">
    Priority senders first, muted ones counted and hidden, every item saying which address it came to
  </text>
</svg>
