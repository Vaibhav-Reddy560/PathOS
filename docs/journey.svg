<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img"
     aria-label="One journey: an auto to Jayadeva Hospital, the Green Line to National College, a walk to BMS College">
  <title>A journey, door to door</title>
  <rect width="1200" height="260" rx="24" fill="#0C1114"/>
  <text x="600" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif"
        font-size="17" fill="#8E9B98">One journey, door to door — every leg timed and costed</text>
  
    <g>
      <line x1="96" y1="120" x2="432" y2="120" stroke="#090B0D" stroke-width="16" stroke-linecap="round"/>
      <line x1="96" y1="120" x2="432" y2="120" stroke="#B8F36B" stroke-width="9" stroke-linecap="round" 
            stroke-dashoffset="0" pathLength="100">
        <animate attributeName="stroke-dasharray" values="0 100;100 0" dur="0.9s" begin="0.3s" fill="freeze"/>
      </line>
    </g>
    <g>
      <line x1="432" y1="120" x2="768" y2="120" stroke="#090B0D" stroke-width="16" stroke-linecap="round"/>
      <line x1="432" y1="120" x2="768" y2="120" stroke="#FF4438" stroke-width="9" stroke-linecap="round" 
            stroke-dashoffset="0" pathLength="100">
        <animate attributeName="stroke-dasharray" values="0 100;100 0" dur="0.9s" begin="1.2s" fill="freeze"/>
      </line>
    </g>
    <g>
      <line x1="768" y1="120" x2="1084" y2="120" stroke="#090B0D" stroke-width="16" stroke-linecap="round"/>
      <line x1="768" y1="120" x2="1084" y2="120" stroke="#B8F36B" stroke-width="9" stroke-linecap="round" stroke-dasharray="14 12"
            stroke-dashoffset="0" pathLength="100">
        <animate attributeName="stroke-dasharray" values="0 100;100 0" dur="0.9s" begin="2.1s" fill="freeze"/>
      </line>
    </g>
  
    <g>
      <circle cx="96" cy="120" r="17" fill="#090B0D"/>
      <circle cx="96" cy="120" r="10" fill="#B8F36B"/>
      <text x="96" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif"
            font-size="19" font-weight="600" fill="#E8F0ED">Home</text>
      <text x="96" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif"
            font-size="15" fill="#8E9B98">Auto to Jayadeva Hospital</text>
      <text x="96" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif"
            font-size="14" fill="#B8F36B" opacity="0.9">2.4 km · 10 min · about ₹40</text>
    </g>
    <g>
      <circle cx="432" cy="120" r="17" fill="#090B0D"/>
      <circle cx="432" cy="120" r="10" fill="#FF4438"/>
      <text x="432" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif"
            font-size="19" font-weight="600" fill="#E8F0ED">Jayadeva Hospital</text>
      <text x="432" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif"
            font-size="15" fill="#8E9B98">Green Line to National College</text>
      <text x="432" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif"
            font-size="14" fill="#FF4438" opacity="0.9">7 stops · 22 min · about ₹30</text>
    </g>
    <g>
      <circle cx="768" cy="120" r="17" fill="#090B0D"/>
      <circle cx="768" cy="120" r="10" fill="#B8F36B"/>
      <text x="768" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif"
            font-size="19" font-weight="600" fill="#E8F0ED">National College</text>
      <text x="768" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif"
            font-size="15" fill="#8E9B98">Walk to BMS College</text>
      <text x="768" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif"
            font-size="14" fill="#B8F36B" opacity="0.9">700 m · 9 min</text>
    </g>
    <g>
      <path d="M1084 120 L1069 94 A 16 16 0 1 1 1099 94 Z" fill="#FFBF69" stroke="#090B0D" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="1084" cy="88" r="6" fill="#090B0D"/>
      <text x="1084" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif"
            font-size="19" font-weight="600" fill="#E8F0ED">BMS College</text>
    </g>
</svg>
